<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For You ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<style>
:root{--bg1:#070816;--bg2:#2a1236;--gold:#f6d28b;--rose:#ff8fab;--ink:#fdf6ec;--p:0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--ink);font-family:'Fraunces',Georgia,serif;font-weight:300;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.aur{position:fixed;width:70vmax;height:40vmax;border-radius:50%;filter:blur(70px);opacity:.35;animation:dr 18s ease-in-out infinite alternate}
.a1{background:#5b3cc4;left:-20vmax;top:-10vmax}.a2{background:#ff5d8f;right:-25vmax;top:20vh;animation-delay:-6s}.a3{background:#14b8a6;left:10vw;bottom:-25vmax;animation-delay:-12s;opacity:.22}
@keyframes dr{to{transform:translate(8vmax,6vmax) rotate(25deg) scale(1.15)}}
canvas{position:fixed;inset:0;width:100%;height:100%}
.layer{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box;transition:opacity 1.4s}
.hide{opacity:0;pointer-events:none}
h1{font-size:clamp(2rem,9vw,4.2rem);font-style:italic;margin:.15em 0;color:var(--gold);text-shadow:0 0 30px #ff8fab88}
h1 i{display:inline-block;opacity:0;transform:translateY(20px) scale(.6);animation:up .8s forwards}
@keyframes up{to{opacity:1;transform:none}}
p{max-width:32ch;line-height:1.55;opacity:.8;margin:.4em 0}
.ring{width:128px;height:128px;border-radius:50%;margin-top:28px;background:conic-gradient(var(--rose) calc(var(--p)*1%),#ffffff1f 0);display:grid;place-items:center;cursor:pointer;touch-action:none;animation:pu 2.4s infinite}
.ring b{width:112px;height:112px;border-radius:50%;background:radial-gradient(circle,#2a1236,#0b0d1f);display:grid;place-items:center;font-weight:300;font-size:.95rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
@keyframes pu{50%{box-shadow:0 0 40px #ff8fab88}}
button{font:inherit;color:#1a0d24;background:linear-gradient(90deg,var(--gold),var(--rose));border:0;border-radius:99px;padding:.7em 1.8em;cursor:pointer;margin-top:14px;box-shadow:0 0 30px #ff8fab55}
#hint{position:fixed;top:calc(env(safe-area-inset-top,0px) + 18px);width:100%;text-align:center;font-size:.8rem;letter-spacing:.3em;text-transform:uppercase;opacity:.6}
#msg{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 7vh);width:100%;text-align:center;font-size:clamp(1.2rem,4.5vw,1.8rem);font-style:italic;padding:0 24px;box-sizing:border-box;min-height:3em;color:var(--gold)}
#fin{justify-content:flex-end;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 6vh);pointer-events:none}#fin button{pointer-events:auto}
</style>
</head>
<body>
<div class="aur a1"></div><div class="aur a2"></div><div class="aur a3"></div>
<canvas id="c"></canvas>
<div id="hint"></div><div id="msg"></div>

<div class="layer" id="intro">
  <p>The sky has been waiting<br>for someone special…</p>
  <h1>Hey, <span class="n"></span></h1>
  <div class="ring" id="ring"><b>hold</b></div>
  <p style="font-size:.8rem;opacity:.5">press &amp; hold to wake the stars<br>(turn sound on 🔊)</p>
</div>

<div class="layer hide" id="fin">
  <h1 id="ttl"></h1>
  <p>You are my favorite constellation.<br>— With all my love</p>
  <button id="again">Replay ✨</button>
</div>

<script>
// ✏️ EDIT THESE
const NAME="Her Name";
const NOTES=["You make ordinary days feel like magic.","Your laugh is my favorite sound.","Every memory with you glows.","You're brave, kind and endlessly you.","With you, I'm always home.","Here's to a whole new year of you."];
const SPOTS=[[.15,.3],[.33,.52],[.5,.28],[.67,.55],[.84,.32],[.5,.76]];

const $=id=>document.getElementById(id),cv=$('c'),x=cv.getContext('2d');
document.querySelectorAll('.n').forEach(e=>e.textContent=NAME);
const F=[523.25,587.33,659.25,783.99,880,1046.5];
let W,H,bg=[],lit=[],rp=[],sp=[],sh=[],fw=[],hp=[],stage=0,t=0,px=0,py=0,mx=0,my=0,ft=0,AC,typ;
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}
addEventListener('resize',size);size();
for(let i=0;i<170;i++)bg.push({x:Math.random(),y:Math.random(),r:Math.random()*1.5+.3,p:Math.random()*6,z:Math.random()});
const pts=()=>SPOTS.map(s=>[s[0]*W,s[1]*H]);

function tone(f,d=1.8,v=.1,w=0){try{const o=AC.createOscillator(),g=AC.createGain(),a=AC.currentTime+w;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,a);g.gain.linearRampToValueAtTime(v,a+.02);g.gain.exponentialRampToValueAtTime(.0001,a+d);o.connect(g);g.connect(AC.destination);o.start(a);o.stop(a+d)}catch(e){}}
function say(s){clearInterval(typ);const m=$('msg');m.textContent='';let i=0;typ=setInterval(()=>{m.textContent+=s[i++]||'';if(i>=s.length)clearInterval(typ)},38)}
function burst(X,Y,n=50){const h=Math.random()*60+320;for(let i=0;i<n;i++){const a=Math.random()*6.283,s=Math.random()*5+1;fw.push({x:X,y:Y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:`hsl(${h+Math.random()*40},90%,70%)`})}}
function heart(){const s=Math.min(W*.8/32,H*.36/30),cx=W/2,cy=H*.3,P=pts();hp=[];for(let i=0;i<150;i++){const a=i/150*6.2832,hx=16*Math.sin(a)**3,hy=-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a));hp.push({x:P[i%6][0],y:P[i%6][1],tx:cx+hx*s,ty:cy+hy*s,d:i*10+300})}ft=performance.now()}

function draw(){
  t+=.03;x.clearRect(0,0,W,H);
  mx+=(px-mx)*.05;my+=(py-my)*.05;
  bg.forEach(s=>{x.globalAlpha=.35+.45*Math.sin(t+s.p);x.fillStyle='#fff';x.beginPath();x.arc(s.x*W+mx*s.z*24,s.y*H+my*s.z*24,s.r,0,7);x.fill()});
  if(Math.random()<.006)sh.push({x:Math.random()*W,y:Math.random()*H*.4,vx:-9,vy:4,l:1});
  sh.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.l-=.02;x.globalAlpha=Math.max(s.l,0);x.strokeStyle='#fff';x.lineWidth=1.5;x.beginPath();x.moveTo(s.x,s.y);x.lineTo(s.x-s.vx*5,s.y-s.vy*5);x.stroke()});sh=sh.filter(s=>s.l>0);
  x.globalAlpha=1;
  if(stage>0){
    const P=pts(),fade=stage==2?Math.max(0,1-(performance.now()-ft)/2500):1;
    x.globalAlpha=fade;x.strokeStyle='#f6d28bcc';x.lineWidth=1.5;x.shadowColor='#f6d28b';x.shadowBlur=12;x.beginPath();
    lit.forEach((k,i)=>i?x.lineTo(...P[k]):x.moveTo(...P[k]));x.stroke();
    P.forEach((p,i)=>{const on=lit.includes(i),r=on?8:6+2*Math.sin(t*2+i);
      x.shadowBlur=on?30:18;x.shadowColor=on?'#ff8fab':'#f6d28b';x.fillStyle=on?'#ffd6e0':'#f6d28b';
      x.beginPath();x.arc(p[0],p[1],r,0,7);x.fill();
      if(on){x.lineWidth=1;x.beginPath();x.moveTo(p[0]-18,p[1]);x.lineTo(p[0]+18,p[1]);x.moveTo(p[0],p[1]-18);x.lineTo(p[0],p[1]+18);x.stroke()}
      else{x.globalAlpha=.25*fade;x.beginPath();x.arc(p[0],p[1],r+9+4*Math.sin(t*2+i),0,7);x.stroke();x.globalAlpha=fade}});
    x.shadowBlur=0;x.globalAlpha=1;
  }
  if(stage==2){const n=performance.now()-ft;x.shadowColor='#ff8fab';x.shadowBlur=14;
    hp.forEach(h=>{if(n>h.d){h.x+=(h.tx-h.x)*.06;h.y+=(h.ty-h.y)*.06}x.globalAlpha=.6+.4*Math.sin(t*3+h.d);x.fillStyle=h.d%20?'#ffd6e0':'#f6d28b';x.beginPath();x.arc(h.x,h.y,2.6,0,7);x.fill()});x.shadowBlur=0;
    if(Math.random()<.04)burst(Math.random()*W,Math.random()*H*.5+20)}
  rp.forEach(r=>{r.r+=3;r.l-=.02;x.globalAlpha=Math.max(r.l,0);x.strokeStyle='#ff8fab';x.beginPath();x.arc(r.x,r.y,r.r,0,7);x.stroke()});rp=rp.filter(r=>r.l>0);
  sp.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.l-=.03;x.globalAlpha=Math.max(s.l,0);x.fillStyle='#f6d28b';x.fillRect(s.x,s.y,2,2)});sp=sp.filter(s=>s.l>0);
  fw.forEach(f=>{f.x+=f.vx;f.y+=f.vy;f.vy+=.06;f.vx*=.99;f.l-=.014;x.globalAlpha=Math.max(f.l,0);x.fillStyle=f.c;x.fillRect(f.x,f.y,2.5,2.5)});fw=fw.filter(f=>f.l>0);
  x.globalAlpha=1;requestAnimationFrame(draw);
}
draw();

addEventListener('pointermove',e=>{px=e.clientX/W-.5;py=e.clientY/H-.5;sp.push({x:e.clientX,y:e.clientY,vx:Math.random()-.5,vy:Math.random()*.8,l:1})});
cv.addEventListener('pointerdown',e=>{
  if(stage!=1)return;
  pts().forEach((p,i)=>{if(!lit.includes(i)&&Math.hypot(p[0]-e.clientX,p[1]-e.clientY)<42){
    lit.push(i);rp.push({x:p[0],y:p[1],r:8,l:1});rp.push({x:p[0],y:p[1],r:0,l:1.3});tone(F[i]);tone(F[i]*2,1.2,.04);say(NOTES[i%NOTES.length]);
    $('hint').textContent=lit.length+' / '+SPOTS.length+' stars';
    if(lit.length==SPOTS.length)setTimeout(finale,2600)}});
});
function finale(){stage=2;heart();$('msg').textContent='';$('hint').textContent='';
  F.concat([1318.5,1568]).forEach((f,i)=>tone(f,2.4,.08,i*.28));
  const T=$('ttl');T.innerHTML='';('Happy Birthday, '+NAME).split('').forEach((c,i)=>{const s=document.createElement('i');s.textContent=c==' '?'\u00a0':c;s.style.animationDelay=(1.2+i*.06)+'s';T.appendChild(s)});
  $('fin').classList.remove('hide');for(let i=0;i<5;i++)setTimeout(()=>burst(Math.random()*W,Math.random()*H*.5+30,70),i*350)}

// hold-to-wake
let hs=0,hr=0;const R=$('ring');
function hold(ts){const p=Math.min((performance.now()-hs)/1300,1);R.style.setProperty('--p',p*100);if(p>=1)return start();hr=requestAnimationFrame(hold)}
R.addEventListener('pointerdown',e=>{e.preventDefault();hs=performance.now();hr=requestAnimationFrame(hold)});
['pointerup','pointerleave','pointercancel'].forEach(ev=>R.addEventListener(ev,()=>{cancelAnimationFrame(hr);R.style.setProperty('--p',0)}));
function start(){try{AC=new (window.AudioContext||window.webkitAudioContext)();F.forEach((f,i)=>tone(f,2,.05,i*.1))}catch(e){}
  $('intro').classList.add('hide');stage=1;$('hint').textContent='Tap the glowing stars'}
$('again').onclick=()=>{lit=[];stage=1;fw=[];hp=[];$('fin').classList.add('hide');$('hint').textContent='Tap the glowing stars'};
</script>
</body>
</html>
